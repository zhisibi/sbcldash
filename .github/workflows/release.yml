name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
      release_title:
        description: 'Release Title'
        required: false
        default: 'Zashboard v1.0.0 Release'

jobs:
  build-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradle Wrapper
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Build Release APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease --stacktrace
          else
            gradle assembleRelease --stacktrace
          fi

      - name: Locate Release APK
        id: apk_finder
        run: |
          APK_PATH=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Release APK not found, checking debug output as fallback..."
            APK_PATH=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          fi
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Determine Release Tag & Title
        id: release_info
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            TITLE="Zashboard ${TAG} Release"
          else
            TAG="${{ github.event.inputs.tag_name || 'v1.0.0' }}"
            TITLE="${{ github.event.inputs.release_title || 'Zashboard v1.0.0 Release' }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          body: |
            ## 🚀 Zashboard Android Release (${{ steps.release_info.outputs.tag }})

            Automatic build generated by GitHub Actions.

            ### ✨ Key Features:
            - **Modern Proxy Management**: Full dashboard for Clash, Sing-box, and Mihomo REST APIs.
            - **Theme & Wallpaper Customization**: Multiple color presets (Violet, Cyber Neon, Deep Ocean, Forest Jade, Sunset Amber, Ink Slate) and background wallpapers with opacity controls.
            - **Proxy Control**: Group expand/collapse, delay speed testing, proxy selection, search filter.
            - **Traffic & Connections**: Real-time speed charts, active connection monitoring, and rule logs.
            - **Multi-backend**: Switch between multiple core servers seamlessly.

            ---
            *APK attached below for download and direct installation.*
          files: ${{ steps.apk_finder.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
